  - cellType: SQL
    cellId: 019ff724-6d2c-74f8-a4b6-0198b14e2257 # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: Country performance
    config:
      source: |2-
            select country_interested,
            count(lead_id) as total_leads,
            count(case when status = 'Enrolled' then lead_id end) as total_enrolled,
            count(case when status = 'Lost' then lead_id end) as total_lost,
            count(case when status IN ('Visa Approved', 'Consultation Done', 'New',
               'Application Submitted', 'Contacted') then lead_id end) as total_on_going,
            ROUND(
                total_enrolled * 100.0
                / total_leads,
                2
            ) as conversion_rate_pct,
            ROUND(
                total_lost * 100.0
                / total_leads,
                2
            ) as lost_rate_pct,
            floor(avg(case when status = 'Enrolled' then cycle_days end)) as average_cycle_days
            from df
            group by country_interested
            order by conversion_rate_pct desc
      dataFrameCell: true
      dataConnectionId: null
