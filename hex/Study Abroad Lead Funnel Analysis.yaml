                - type: lic
                  children:
                    - text: 'Follow-up বেশি করলে conversion বাড়ে কিনা? hint: এটা group by না, এটা correlation/relationship দেখার বিষয়। দুইভাবে করা যায় — (a) follow_up_count-কে bucket/bin-এ ভাগ করো (যেমন 0-2, 3-5, 6+), তারপর প্রতি bucket-এ conversion rate বের করো, অথবা (b) সরাসরি follow_up_count আর "Enrolled কিনা (1/0)" এর মধ্যে correlation coefficient বের করো (pandas-এ .corr())।'
  - cellType: SQL
    cellId: 019ff234-9842-73c4-a72e-a9977c6182aa # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: Counselor performance
    config:
      source: |-
        with counselors_performance as(
                select branch, counselor, 
                count(lead_id) as total_counseling,
                count(case when status = 'Enrolled' then lead_id end) as total_enrolled,
                ROUND(
                total_enrolled * 100.0
                / total_counseling,
                2
            ) as conversion_rate_pct,
                floor(avg(cycle_days)) as average_cycle_days
                from df
                group by branch, counselor
                order by branch, conversion_rate_pct desc, average_cycle_days asc
        )
        select * from counselors_performance
