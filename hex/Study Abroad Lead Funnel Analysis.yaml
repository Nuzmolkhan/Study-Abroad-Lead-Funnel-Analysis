    cellId: 019ffb01-7914-746f-8629-5ca5d1ce1423 # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: Top and bottom counselor per branch
    config:
      source: |-
        with ranked as (
            select
                branch,
                counselor,
                total_counseling,
                total_enrolled,
                conversion_rate_pct,
                row_number() over (partition by branch order by conversion_rate_pct desc) as rank_best,
                row_number() over (partition by branch order by conversion_rate_pct asc) as rank_worst
            from counselors_performance
        )
        select
            branch,
            counselor,
            branch || ' — ' || counselor as branch_counselor,
            case when rank_best = 1 then 'Top' else 'Bottom' end as performance_group,
            total_counseling,
            total_enrolled,
            conversion_rate_pct
        from ranked
        where rank_best = 1 or rank_worst = 1
        order by branch, conversion_rate_pct desc
      dataFrameCell: true
