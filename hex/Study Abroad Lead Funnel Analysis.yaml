  - cellType: SQL
    cellId: 019ffa6c-4c14-751d-a753-f00024e876a5 # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: Channel metric scored
    config:
      source: |-
        with z as (
            select
                channel,
                total_leads,
                win_rate_pct,
                resolution_rate_pct,
                followups_per_enrolment,
                (win_rate_pct - avg(win_rate_pct) over ())
                    / nullif(stddev_samp(win_rate_pct) over (), 0) as z_win,
                (resolution_rate_pct - avg(resolution_rate_pct) over ())
                    / nullif(stddev_samp(resolution_rate_pct) over (), 0) as z_resolution,
                (followups_per_enrolment - avg(followups_per_enrolment) over ())
                    / nullif(stddev_samp(followups_per_enrolment) over (), 0) as z_effort
            from channel_metrics
        )
        select
            channel,
            total_leads,
            win_rate_pct,
            resolution_rate_pct,
            followups_per_enrolment,
            round(z_win, 2) as z_win,
            round(z_resolution, 2) as z_resolution,
            round(-z_effort, 2) as z_effort_inverted,
            round(0.5 * z_win + 0.2 * z_resolution - 0.3 * z_effort, 2) as channel_score
        from z
        order by channel_score desc
      dataFrameCell: true
      dataConnectionId: null
