  - cellType: SQL
    cellId: 019ffa6d-598b-7383-8b91-162338fdad65 # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: Channel metrics
    config:
      source: |-
        select
            channel,
            count(lead_id) as total_leads,
            count(case when status = 'Enrolled' then lead_id end) as enrolled,
            count(case when status = 'Lost' then lead_id end) as lost,
            count(case when status in ('Enrolled', 'Lost') then lead_id end) as resolved,

            round(count(case when status = 'Enrolled' then lead_id end) * 100.0
                  / count(lead_id), 1) as conversion_rate_pct,

            round(count(case when status = 'Enrolled' then lead_id end) * 100.0
                  / count(case when status in ('Enrolled', 'Lost') then lead_id end), 1) as win_rate_pct,

            round(count(case when status in ('Enrolled', 'Lost') then lead_id end) * 100.0
                  / count(lead_id), 1) as resolution_rate_pct,

            round(avg(case when status = 'Enrolled' then cycle_days end), 1) as avg_cycle_won,
            round(avg(case when status = 'Lost' then cycle_days end), 1) as avg_cycle_lost,

            round(sum(follow_up_count)
                  /count(case when status = 'Enrolled' then lead_id end), 1) as followups_per_enrolment

        from df
        group by channel
        order by win_rate_pct desc
      dataFrameCell: true
      dataConnectionId: null
